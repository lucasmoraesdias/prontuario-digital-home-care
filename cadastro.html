<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro - Prontuário Home Care</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-page">
  <section class="auth-card">
    <img src="assets/logo.svg" alt="Logo Roberta Gomes Enfermeira Home Care" class="logo" />
    <h1>Cadastro de usuário</h1>
    <p>Crie um acesso para utilizar o sistema.</p>

    <form id="formCadastro">
      <label for="nomeUsuario">Nome completo</label>
      <input type="text" id="nomeUsuario" required />

      <label for="emailCadastro">E-mail</label>
      <input type="email" id="emailCadastro" required />

      <label for="senhaCadastro">Senha</label>
      <input type="password" id="senhaCadastro" minlength="4" required />

      <button type="submit" class="btn-principal">Cadastrar</button>
    </form>

    <div class="link-auth">
      Já possui cadastro? <a href="index.html">Voltar para login</a>
    </div>
  </section>

  <script src="auth.js"></script>
</body>
</html>
